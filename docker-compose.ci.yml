services:
  postgres:
    healthcheck:
      interval: 1s
      timeout: 3s
      retries: 30
  auth:
    healthcheck:
      interval: 30s
      timeout: 3s
      start_period: 30s
      start_interval: 1s
      retries: 3
  vault:
    healthcheck:
      interval: 30s
      timeout: 3s
      start_period: 30s
      start_interval: 1s
      retries: 3
