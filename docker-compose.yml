name: clipboard-vault
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipboard_vault}
      POSTGRES_USER: ${POSTGRES_USER:-vault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./auth/migrations/auth-schema.sql:/docker-entrypoint-initdb.d/001-auth.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vault} -d ${POSTGRES_DB:-clipboard_vault}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
  auth:
    build: { context: ./auth }
    image: clipboard-vault-auth:local
    restart: unless-stopped
    environment:
      AUTH_PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clipboard_vault}
      BETTER_AUTH_URL: ${PUBLIC_BASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      AUTH_BRIDGE_SECRET: ${AUTH_BRIDGE_SECRET}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
  vault:
    build: { context: . }
    image: clipboard-vault:local
    restart: unless-stopped
    environment:
      PORT: "8080"
      RUST_LOG: ${RUST_LOG:-clipboard_vault=info,tower_http=info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-vault}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clipboard_vault}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      AUTH_INTERNAL_URL: http://auth:3001
      AUTH_BRIDGE_SECRET: ${AUTH_BRIDGE_SECRET}
      UPLOAD_ROOT: /data/uploads
      SERVER_MAX_UPLOAD_BYTES: ${SERVER_MAX_UPLOAD_BYTES:-10737418240}
      LEGACY_MAX_UPLOAD_BYTES: ${LEGACY_MAX_UPLOAD_BYTES:-104857600}
      TUS_CHUNK_SIZE_BYTES: ${TUS_CHUNK_SIZE_BYTES:-16777216}
      TUS_SESSION_TTL_SECONDS: ${TUS_SESSION_TTL_SECONDS:-604800}
      UPLOAD_DISK_RESERVE_BYTES: ${UPLOAD_DISK_RESERVE_BYTES:-21474836480}
    volumes: [vault-files:/data/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      auth: { condition: service_healthy }
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      NGINX_TEMPLATE: ${NGINX_TEMPLATE:-http.conf.template}
      NGINX_LEGACY_CLIENT_MAX_BODY_SIZE: ${NGINX_LEGACY_CLIENT_MAX_BODY_SIZE:-101m}
      NGINX_TUS_CLIENT_MAX_BODY_SIZE: ${NGINX_TUS_CLIENT_MAX_BODY_SIZE:-17m}
    command:
      - /bin/sh
      - -c
      - envsubst '$$DOMAIN $$NGINX_LEGACY_CLIENT_MAX_BODY_SIZE $$NGINX_TUS_CLIENT_MAX_BODY_SIZE' < /etc/nginx/templates/$${NGINX_TEMPLATE} > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx:/etc/nginx/templates:ro
      - certbot-web:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      vault: { condition: service_healthy }
      auth: { condition: service_healthy }
    networks: [edge, backend]
    security_opt: [no-new-privileges:true]
  certbot:
    image: certbot/certbot:v3.2.0
    profiles: [certificates]
    volumes:
      - certbot-web:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks: [edge]
networks:
  edge:
  backend: { internal: true }
volumes:
  postgres-data:
  vault-files:
  certbot-web:
  letsencrypt:
