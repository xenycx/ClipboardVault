name: clipboard-vault
# One application container and one data volume. Nginx and certbot are optional:
# keep them when this host terminates TLS itself; behind another proxy, drop them,
# publish the vault port, and set TRUST_PROXY_HEADERS to match that proxy.
services:
  vault:
    build: { context: . }
    image: clipboard-vault:local
    restart: unless-stopped
    environment:
      PORT: "8080"
      RUST_LOG: ${RUST_LOG:-clipboard_vault=info,tower_http=info}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      VAULT_SECRET: ${VAULT_SECRET:?Set VAULT_SECRET in .env}
      SETUP_TOKEN: ${SETUP_TOKEN:?Set SETUP_TOKEN in .env}
      DATA_DIR: /data
      # Nginx below appends the client address to X-Forwarded-For.
      TRUST_PROXY_HEADERS: "true"
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      SERVER_MAX_UPLOAD_BYTES: ${SERVER_MAX_UPLOAD_BYTES:-10737418240}
      LEGACY_MAX_UPLOAD_BYTES: ${LEGACY_MAX_UPLOAD_BYTES:-104857600}
      TUS_CHUNK_SIZE_BYTES: ${TUS_CHUNK_SIZE_BYTES:-16777216}
      TUS_SESSION_TTL_SECONDS: ${TUS_SESSION_TTL_SECONDS:-604800}
      UPLOAD_DISK_RESERVE_BYTES: ${UPLOAD_DISK_RESERVE_BYTES:-21474836480}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
    volumes: [vault-data:/data]
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: ${VAULT_MEMORY_LIMIT:-256m}
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      NGINX_TEMPLATE: ${NGINX_TEMPLATE:-http.conf.template}
      NGINX_LEGACY_CLIENT_MAX_BODY_SIZE: ${NGINX_LEGACY_CLIENT_MAX_BODY_SIZE:-101m}
      NGINX_TUS_CLIENT_MAX_BODY_SIZE: ${NGINX_TUS_CLIENT_MAX_BODY_SIZE:-17m}
    command:
      - /bin/sh
      - -c
      - envsubst '$$DOMAIN $$NGINX_LEGACY_CLIENT_MAX_BODY_SIZE $$NGINX_TUS_CLIENT_MAX_BODY_SIZE' < /etc/nginx/templates/$${NGINX_TEMPLATE} > /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx:/etc/nginx/templates:ro
      - certbot-web:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      vault: { condition: service_healthy }
    networks: [edge, backend]
    security_opt: [no-new-privileges:true]
  certbot:
    image: certbot/certbot:v3.2.0
    profiles: [certificates]
    volumes:
      - certbot-web:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    networks: [edge]
networks:
  edge:
  backend: { internal: true }
volumes:
  vault-data:
  certbot-web:
  letsencrypt:
