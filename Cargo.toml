[package]
name = "clipboard-vault"
version = "3.0.2"
edition = "2024"
license = "MIT"
description = "A fast, self-hosted team vault for pasted content and files"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
base64 = "0.22"
askama = "0.14"
axum = { version = "0.8", features = ["http2", "json", "multipart", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
encoding_rs = "0.8"
futures-util = { version = "0.3", default-features = false }
libc = "0.2"
hex = "0.4"
hmac = "0.12"
mime_guess = "2.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
scrypt = { version = "0.11", default-features = false }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1.45", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["catch-panic", "compression-gzip", "fs", "limit", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1.16", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
