{% extends "base.html" %}
{% block title %}Reset password · Clipboard Vault{% endblock %}
{% block content %}<section class="center-card panel"><span class="eyebrow">MANUAL RESET</span><h1>Choose a new password</h1><form data-reset-password class="stack"><input type="hidden" name="token" value="{{ token }}"><label>New password<input type="password" name="newPassword" minlength="8" maxlength="128" required autocomplete="new-password"></label><button class="button primary" type="submit">Update password</button></form><p class="form-error" data-auth-error role="alert"></p></section>{% endblock %}
