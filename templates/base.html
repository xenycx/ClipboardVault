<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}Clipboard Vault{% endblock %}</title>
  <meta name="description" content="A fast private workspace for pasted content and files.">
  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem("clipboard-vault.theme");
        document.documentElement.dataset.theme = savedTheme === "light" ? "light" : "dark";
      } catch (_) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/vendor/highlight-github-dark.min.css">
  <script src="/static/vendor/highlight.min.js" defer></script>
  <script src="/static/vendor/marked.umd.js" defer></script>
  <script src="/static/vendor/purify.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="Clipboard Vault home">
        <span class="brand-mark" aria-hidden="true">CV</span>
        <span class="brand-copy"><strong>Clipboard Vault</strong><small>Private workspace</small></span>
      </a>
      <div class="header-actions">
        {% block nav %}{% endblock %}
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light theme" title="Switch theme">
          <span class="theme-icon theme-icon-dark" aria-hidden="true">☾</span>
          <span class="theme-icon theme-icon-light" aria-hidden="true">☀</span>
          <span class="theme-label">Theme</span>
        </button>
      </div>
    </div>
  </header>
  <main class="shell">{% block content %}{% endblock %}</main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
