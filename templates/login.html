{% extends "auth_base.html" %}
{% block title %}Sign in &middot; Clipboard Vault{% endblock %}
{% block auth_card %}
<div class="card auth-card">
  <input type="radio" name="auth-mode" id="auth-signin" class="mode-radio" checked>
  <input type="radio" name="auth-mode" id="auth-signup" class="mode-radio">
  <div class="segmented wide">
    <label for="auth-signin">Sign in</label>
    <label for="auth-signup">Create account</label>
  </div>

  <div class="pane pane-signin">
    <div class="social-providers" data-social-providers hidden aria-label="Social sign-in options"></div>
    <template data-social-provider-template>
      <button class="button quiet block social-provider" type="button">
        <span class="provider-mark" data-provider-mark aria-hidden="true"></span>
        <span data-provider-label></span>
      </button>
    </template>
    <div class="divider" data-social-divider hidden><span>or continue with email</span></div>
    <form data-auth-form="signin" class="stack">
      <label class="field">Email<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required></label>
      <label class="field">Password<input type="password" name="password" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" minlength="8" required></label>
      <button class="button primary block" type="submit">Sign in<svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg></button>
    </form>
  </div>

  <div class="pane pane-signup">
    <p class="pane-lede">New accounts wait for a server administrator to approve them before any workspace opens.</p>
    <form data-auth-form="signup" class="stack">
      <label class="field">Name<input name="name" autocomplete="name" placeholder="Ada Lovelace" required maxlength="80"></label>
      <label class="field">Email<input type="email" name="email" autocomplete="email" placeholder="you@example.com" required></label>
      <label class="field">Password<input type="password" name="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" maxlength="128" required></label>
      <button class="button primary block" type="submit">Register for approval<svg class="i" aria-hidden="true"><use href="#i-arrow"/></svg></button>
    </form>
  </div>

  <p class="form-error" data-auth-error role="alert"></p>
</div>
{% endblock %}
