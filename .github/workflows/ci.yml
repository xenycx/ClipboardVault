name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clipboard_vault
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vault -d clipboard_vault"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://vault:vault-ci-password@127.0.0.1:5432/clipboard_vault
      BETTER_AUTH_SECRET: auth-ci-secret-with-at-least-32-bytes
    defaults:
      run:
        working-directory: auth
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: auth/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Confirm Better Auth schema has no delta
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U vault -d clipboard_vault < migrations/auth-schema.sql
          rm -f migrations/generated.sql
          pnpm auth:generate
          test ! -s migrations/generated.sql

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: pytest -q tests
      - run: cp .env.example .env
      - run: docker compose config --quiet

  integration:
    runs-on: ubuntu-latest
    needs: [rust, auth, contracts]
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure test deployment
        run: |
          cp .env.example .env
          sed -i 's|DOMAIN=vault.example.com|DOMAIN=localhost|' .env
          sed -i 's|PUBLIC_BASE_URL=https://vault.example.com|PUBLIC_BASE_URL=http://localhost|' .env
          sed -i 's|SERVER_MAX_UPLOAD_BYTES=10737418240|SERVER_MAX_UPLOAD_BYTES=67108864|' .env
          sed -i 's|LEGACY_MAX_UPLOAD_BYTES=104857600|LEGACY_MAX_UPLOAD_BYTES=8388608|' .env
          sed -i 's|TUS_CHUNK_SIZE_BYTES=16777216|TUS_CHUNK_SIZE_BYTES=1048576|' .env
          sed -i 's|TUS_SESSION_TTL_SECONDS=604800|TUS_SESSION_TTL_SECONDS=300|' .env
          sed -i 's|UPLOAD_DISK_RESERVE_BYTES=21474836480|UPLOAD_DISK_RESERVE_BYTES=1048576|' .env
          sed -i 's|NGINX_LEGACY_CLIENT_MAX_BODY_SIZE=101m|NGINX_LEGACY_CLIENT_MAX_BODY_SIZE=9m|' .env
          sed -i 's|NGINX_TUS_CLIENT_MAX_BODY_SIZE=17m|NGINX_TUS_CLIENT_MAX_BODY_SIZE=2m|' .env
          sed -i 's|GOOGLE_CLIENT_ID=|GOOGLE_CLIENT_ID=google-ci-client|' .env
          sed -i 's|GOOGLE_CLIENT_SECRET=|GOOGLE_CLIENT_SECRET=google-ci-secret|' .env
          sed -i 's|GITHUB_CLIENT_ID=|GITHUB_CLIENT_ID=github-ci-client|' .env
          sed -i 's|GITHUB_CLIENT_SECRET=|GITHUB_CLIENT_SECRET=github-ci-secret|' .env
          sed -i 's|DISCORD_CLIENT_ID=|DISCORD_CLIENT_ID=discord-ci-client|' .env
          sed -i 's|DISCORD_CLIENT_SECRET=|DISCORD_CLIENT_SECRET=discord-ci-secret|' .env
      - name: Build and load Rust image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: clipboard-vault:local
          cache-from: type=gha,scope=clipboard-vault-rust
          cache-to: type=gha,mode=max,scope=clipboard-vault-rust
      - name: Build and load auth image
        uses: docker/build-push-action@v6
        with:
          context: auth
          load: true
          tags: clipboard-vault-auth:local
          cache-from: type=gha,scope=clipboard-vault-auth
          cache-to: type=gha,mode=max,scope=clipboard-vault-auth
      - name: Start the exact images under test
        run: docker compose up -d --no-build
      - name: Wait for readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost/health/ready; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Test enabled provider discovery and redirects
        run: |
          curl -fsS -D provider-headers.txt -o providers.json http://localhost/api/auth/vault/providers
          grep -qi '^cache-control: no-store' provider-headers.txt
          jq -e '.data.providers == [{"id":"google","label":"Google"},{"id":"github","label":"GitHub"},{"id":"discord","label":"Discord"}]' providers.json
          for provider in google github discord; do
            body=$(jq -nc --arg provider "$provider" '{provider:$provider,callbackURL:"/pending",errorCallbackURL:"/login"}')
            curl -fsS -H 'Origin: http://localhost' -H 'Content-Type: application/json' \
              -d "$body" http://localhost/api/auth/sign-in/social | jq -e '.url | startswith("https://")'
          done
      - name: Bootstrap account and API key
        run: |
          curl -fsS -c cookies.txt -H 'Origin: http://localhost' -H 'Content-Type: application/json' \
            -d '{"name":"CI Admin","email":"ci@example.test","password":"correct-horse-battery-staple"}' \
            http://localhost/api/auth/sign-up/email
          curl -fsS -b cookies.txt -H 'Origin: http://localhost' -H 'Content-Type: application/json' \
            -d '{"token":"replace-with-at-least-32-random-bytes"}' \
            http://localhost/api/auth/vault/bootstrap
          user_id=$(docker compose exec -T postgres psql -U vault -d clipboard_vault -Atc "SELECT id FROM \"user\" WHERE email='ci@example.test'")
          organization_id=$(docker compose exec -T postgres psql -U vault -d clipboard_vault -Atc "SELECT \"organizationId\" FROM member WHERE \"userId\"='$user_id' LIMIT 1")
          key_json=$(docker compose exec -T -e TEST_USER_ID="$user_id" -e TEST_ORG_ID="$organization_id" auth node -e \
            'fetch("http://127.0.0.1:3001/internal/api-keys", {method:"POST", headers:{"content-type":"application/json","x-auth-bridge-secret":process.env.AUTH_BRIDGE_SECRET}, body:JSON.stringify({organizationId:process.env.TEST_ORG_ID,requesterId:process.env.TEST_USER_ID,name:"CI uploader",expiresInDays:1,permissions:["items:write","items:read","items:delete"]})}).then(async r=>{const text=await r.text();if(!r.ok)throw new Error(text);process.stdout.write(text)})')
          echo "$key_json" | jq -r '.data.secret' > api-key.txt
          test -s api-key.txt
      - name: Run Python uploader end to end
        run: |
          python -m pip install requests
          printf 'integration upload\n' > integration.txt
          python examples/upload_file.py integration.txt --server http://localhost --api-key "$(cat api-key.txt)" --path /ci --tag integration
          curl -fsS -H "X-API-Key: $(cat api-key.txt)" 'http://localhost/api/v1/items?tag=integration' | jq -e '.items | length == 1'
      - name: Test resumable upload and ranged read
        run: |
          dd if=/dev/zero of=resumable.bin bs=1048576 count=3 status=none
          printf 'final partial chunk' >> resumable.bin
          upload_size=$(wc -c < resumable.bin)
          metadata="filename $(printf resumable.bin | base64 -w0),virtualPath $(printf /ci | base64 -w0),tags $(printf '[\"resumable\"]' | base64 -w0)"
          curl -fsS -D upload-headers.txt -o /dev/null -X POST \
            -H "X-API-Key: $(cat api-key.txt)" -H 'Tus-Resumable: 1.0.0' \
            -H "Upload-Length: $upload_size" -H "Upload-Metadata: $metadata" \
            http://localhost/api/v1/uploads
          upload_url=$(awk 'tolower($1)=="location:" {gsub("\\r", "", $2); print $2}' upload-headers.txt)
          test -n "$upload_url"
          head -c 1048576 resumable.bin | curl -fsS -o /dev/null -X PATCH \
            -H "X-API-Key: $(cat api-key.txt)" -H 'Tus-Resumable: 1.0.0' \
            -H 'Upload-Offset: 0' -H 'Content-Type: application/offset+octet-stream' \
            --data-binary @- "$upload_url"
          python examples/upload_resumable.py resumable.bin --server http://localhost --api-key "$(cat api-key.txt)" --upload-url "$upload_url" --chunk-mib 1
          item_id=$(curl -fsS -H "X-API-Key: $(cat api-key.txt)" 'http://localhost/api/v1/items?tag=resumable' | jq -er '.items[0].id')
          test -n "$item_id"
          status=$(curl -sS -o ranged.bin -w '%{http_code}' -H "X-API-Key: $(cat api-key.txt)" -H 'Range: bytes=1048576-2097151' "http://localhost/api/v1/items/$item_id/content")
          test "$status" = 206
          test "$(wc -c < ranged.bin)" = 1048576
          curl -fsS -X DELETE -H "X-API-Key: $(cat api-key.txt)" "http://localhost/api/v1/items/$item_id"
          storage=$(curl -fsS -b cookies.txt http://localhost/api/v1/storage)
          echo "$storage" | jq -e --arg id "$item_id" '.reserveBytes == 1048576 and any(.items[]; .id == $id and .deleted)'
          workspace_name=$(echo "$storage" | jq -er '.workspaceName')
          purge_body=$(jq -nc --arg id "$item_id" --arg confirmation "$workspace_name" '{itemIds:[$id],confirmation:$confirmation}')
          curl -fsS -X POST -b cookies.txt -H 'Origin: http://localhost' -H 'Content-Type: application/json' -d "$purge_body" http://localhost/api/v1/storage/purge | jq -e '.purged == 1'
      - name: Test text preview and forced download
        run: |
          item_id=$(curl -fsS -H "X-API-Key: $(cat api-key.txt)" 'http://localhost/api/v1/items?tag=integration' | jq -er '.items[0].id')
          curl -fsSI -H "X-API-Key: $(cat api-key.txt)" "http://localhost/api/v1/items/$item_id/preview" | grep -qi '^X-Preview-Kind: text'
          curl -fsSI -H "X-API-Key: $(cat api-key.txt)" "http://localhost/api/v1/items/$item_id/content?download=1" | grep -qi '^Content-Disposition: attachment'
      - name: Test low-disk upload rejection
        run: |
          sed -i 's|UPLOAD_DISK_RESERVE_BYTES=1048576|UPLOAD_DISK_RESERVE_BYTES=18446744073709551615|' .env
          docker compose up -d --no-deps --force-recreate vault
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost/health/ready; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          status=$(curl -sS -o low-disk.json -w '%{http_code}' -X POST \
            -H "X-API-Key: $(cat api-key.txt)" -H 'Tus-Resumable: 1.0.0' \
            -H 'Upload-Length: 1' -H 'Upload-Metadata: filename bG93LWRpc2sudHh0' \
            http://localhost/api/v1/uploads)
          test "$status" = 507
          jq -e '.error.code == "INSUFFICIENT_STORAGE"' low-disk.json
          legacy_status=$(curl -sS -o legacy-low-disk.json -w '%{http_code}' -X POST \
            -H "X-API-Key: $(cat api-key.txt)" -F 'file=@integration.txt' \
            http://localhost/api/v1/items)
          test "$legacy_status" = 507
          jq -e '.error.code == "INSUFFICIENT_STORAGE"' legacy-low-disk.json
          item_id=$(curl -fsS -H "X-API-Key: $(cat api-key.txt)" 'http://localhost/api/v1/items?tag=integration' | jq -er '.items[0].id')
          curl -fsSI -H "X-API-Key: $(cat api-key.txt)" "http://localhost/api/v1/items/$item_id/preview" | grep -qi '^X-Preview-Kind: text'
          curl -fsSI -H "X-API-Key: $(cat api-key.txt)" "http://localhost/api/v1/items/$item_id/content?download=1" | grep -qi '^Content-Disposition: attachment'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v
